<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Blink Counter</title>
<style>
body{font-family:system-ui,sans-serif;text-align:center;background:#111;color:#fff;margin:0;padding:20px}
h1{margin:8px 0 4px} p{color:#bbb}
video{width:min(92vw,720px);border-radius:18px;transform:scaleX(-1);background:#222}
#count{font-size:48px;font-weight:700;margin:15px}
button{font-size:18px;padding:12px 22px;border:0;border-radius:12px}
#status{margin:12px;color:#9f9}
</style>
</head>
<body>
<h1>👁️ Live Blink Counter</h1>
<p>Allow camera access, look toward the camera, and blink normally.</p>
<video id="video" autoplay playsinline></video>
<div id="count">Blinks: 0</div>
<div id="status">Starting camera…</div>
<button onclick="resetCount()">Reset</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const video=document.getElementById('video');
const countEl=document.getElementById('count');
const statusEl=document.getElementById('status');
let blinks=0, closed=false, lastBlink=0;

function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
const L=[362,385,387,263,373,380], R=[33,160,158,133,153,144];

function ear(p,e){
  return (d(p[e[1]],p[e[5]])+d(p[e[2]],p[e[4]]))/(2*d(p[e[0]],p[e[3]]));
}
function resetCount(){blinks=0;closed=false;countEl.textContent="Blinks: 0"}

const mesh=new FaceMesh({locateFile:f=>
  `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
mesh.setOptions({maxNumFaces:1,refineLandmarks:true,
  minDetectionConfidence:.5,minTrackingConfidence:.5});

mesh.onResults(r=>{
  if(!r.multiFaceLandmarks?.length){
    statusEl.textContent="No face detected — look toward the camera.";
    return;
  }
  statusEl.textContent="Camera active ✓";
  const p=r.multiFaceLandmarks[0];
  const e=(ear(p,L)+ear(p,R))/2;
  const now=performance.now();

  if(e<.20){
    if(!closed && now-lastBlink>250) closed=true;
  }else if(closed){
    if(now-lastBlink>250){blinks++; lastBlink=now;}
    closed=false;
    countEl.textContent=`Blinks: ${blinks}`;
  }
});

const cam=new Camera(video,{
  onFrame:async()=>{await mesh.send({image:video})},
  width:640,height:480
});

navigator.mediaDevices?.getUserMedia({video:true})
.then(()=>{statusEl.textContent="Camera permission granted ✓"; cam.start()})
.catch(err=>{
  statusEl.textContent="Camera permission denied or unavailable.";
  console.error(err);
});
</script>
</body>
</html>
